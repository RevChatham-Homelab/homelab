services:
  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    restart: unless-stopped

    command:
      - -config.file=/etc/loki/local-config.yaml

    networks:
      - homelab

    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

volumes:
  loki-data:

networks:
  homelab:
    external: true
